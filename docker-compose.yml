services:
  drill-console:
    build: .
    image: drill-injection-console:latest
    container_name: drill-injection-console
    ports:
      - "8000:8000"
    environment:
      # SQLite 数据库文件位置（挂载到命名卷持久化）
      DB_PATH: /data/drill.db
    volumes:
      - drill-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  drill-data:
